<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SyntaxWear - E-commerce de roupas">
  <title>SyntaxWear</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet"> -->
</head>
<body>
  <header class="site-header">
    <!-- Logo and main menu (Masculino ... Sobre) go here, before the actions menu -->

    <nav class="header-actions" aria-label="Conta e compras">
      <ul class="header-actions__list" role="list">
        <li>
          <a class="header-actions__link" href="#">
            <svg class="header-actions__icon" width="24" height="24" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="4" />
              <path d="M4.5 20.5a7.5 6 0 0 1 15 0Z" />
            </svg>
            <span class="visually-hidden">Minha conta</span>
          </a>
        </li>
        <li>
          <a class="header-actions__link" href="#">
            <svg class="header-actions__icon" width="24" height="24" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="9.5" />
              <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6" />
              <path d="M12 17.25h.01" />
            </svg>
            <span class="visually-hidden">Ajuda</span>
          </a>
        </li>
        <li>
          <a class="header-actions__link" href="#">
            <svg class="header-actions__icon" width="24" height="24" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M5.5 7.5h13v13h-13Z" />
              <path d="M9 10V6.5a3 3 0 0 1 6 0V10" />
            </svg>
            <span class="visually-hidden">Carrinho</span>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero"></section>
    
    <section class="categories"></section>

    <section class="featured"></section>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>
